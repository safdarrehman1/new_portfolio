<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-letsplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accent-supabase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-letsplay)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#09141b" stroke="#14b8a6" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Title bar -->
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#132733" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#99f6e4" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Let's Play — Sports Management Admin (Supabase Backend)</text>

  <!-- Left: Supabase Tables & Schema Control -->
  <g transform="translate(70, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#0e1e24" stroke="#1e3a45" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">⚡ Supabase Auth &amp; Database</text>
    <text x="20" y="52" fill="#5eead4" font-family="sans-serif" font-size="11">Realtime Postgres subscriptions &amp; RLS</text>

    <!-- Table 1 -->
    <rect x="15" y="70" width="290" height="60" rx="6" fill="#152b34" stroke="#2dd4bf" stroke-opacity="0.3" />
    <text x="30" y="92" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Table: tournaments_match_schedule</text>
    <text x="30" y="112" fill="#99f6e4" font-family="sans-serif" font-size="10">84 Rows • RLS Policies Enabled • Realtime ON</text>

    <!-- Table 2 -->
    <rect x="15" y="140" width="290" height="60" rx="6" fill="#152b34" stroke="#1e3a45" />
    <text x="30" y="162" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Table: player_rosters &amp; teams</text>
    <text x="30" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="10">520 Players Registered • Verified KYC</text>

    <!-- Supabase Status Banner -->
    <rect x="15" y="215" width="290" height="115" rx="6" fill="url(#accent-supabase)" />
    <text x="30" y="242" fill="#042f2e" font-family="sans-serif" font-size="11" font-weight="bold">EDGE NETWORK STATUS</text>
    <text x="30" y="275" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Supabase Cloud</text>
    <text x="30" y="305" fill="#042f2e" font-family="sans-serif" font-size="11" font-weight="600">Sub-10ms JWT Token Verification</text>
  </g>

  <!-- Right: Admin Panel View -->
  <g transform="translate(410, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#0e1e24" stroke="#1e3a45" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🏆 Tournament Dashboard</text>
    <text x="20" y="52" fill="#9ca3af" font-family="sans-serif" font-size="11">Live scores, venue booking &amp; referee assign</text>

    <!-- Match card -->
    <rect x="15" y="70" width="290" height="75" rx="6" fill="#152b34" stroke="#2dd4bf" stroke-opacity="0.3" />
    <text x="30" y="95" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Semi-Finals: Islamabad vs Peshawar</text>
    <text x="30" y="115" fill="#2dd4bf" font-family="sans-serif" font-size="11">LIVE SCORE: 3 - 2 (78' mins)</text>
    <text x="280" y="115" fill="#f43f5e" font-family="sans-serif" font-size="10" text-anchor="end" font-weight="bold">🔴 STREAMING</text>
    <text x="30" y="133" fill="#9ca3af" font-family="sans-serif" font-size="10">Referee: Assigned • Pitch A</text>

    <!-- Venue allocation -->
    <rect x="15" y="155" width="290" height="70" rx="6" fill="#152b34" stroke="#1e3a45" />
    <text x="30" y="180" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Venue Booking Grid</text>
    <text x="30" y="200" fill="#99f6e4" font-family="sans-serif" font-size="11">12 Arenas Available • 94% Weekend Slot Occupancy</text>

    <!-- Tech specs -->
    <rect x="15" y="235" width="290" height="95" rx="6" fill="#09141b" stroke="#14b8a6" stroke-opacity="0.2" />
    <text x="30" y="260" fill="#2dd4bf" font-family="sans-serif" font-size="11" font-weight="bold">ARCHITECTURE STACK</text>
    <text x="30" y="282" fill="#ffffff" font-family="sans-serif" font-size="11">Next.js 15 App Router • TypeScript</text>
    <text x="30" y="302" fill="#9ca3af" font-family="sans-serif" font-size="10">Deployed on Vercel Edge Network</text>
  </g>
</svg>
