    <text x="15" y="55" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">$1,450,800</text>

    <rect x="225" y="0" width="205" height="75" rx="8" fill="#082f49" stroke="#0284c7" />
    <text x="15" y="25" fill="#7dd3fc" font-family="sans-serif" font-size="11">Monthly Recoveries</text>
    <text x="15" y="55" fill="#34d399" font-family="sans-serif" font-size="22" font-weight="bold">$128,450</text>

    <rect x="450" y="0" width="210" height="75" rx="8" fill="#082f49" stroke="#0284c7" />
    <text x="15" y="25" fill="#7dd3fc" font-family="sans-serif" font-size="11">On-Time Repayment Rate</text>
    <text x="15" y="55" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">98.4%</text>
  </g>

  <!-- Amortization Ledger Table -->
  <g transform="translate(70, 185)">
    <rect x="0" y="0" width="660" height="255" rx="8" fill="#0c2331" stroke="#164e63" />
    <text x="20" y="30" fill="#f0fdfa" font-family="sans-serif" font-size="13" font-weight="bold">Recent Installment Portfolios</text>
    
    <!-- Table Header -->
    <rect x="15" y="45" width="630" height="30" rx="4" fill="#164e63" />
    <text x="30" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600">Client / Plan</text>
    <text x="180" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600">Total Loan</text>
    <text x="300" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600">Installment</text>
    <text x="420" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600">Due Date</text>
    <text x="540" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600">Status</text>

    <!-- Row 1 -->
    <rect x="15" y="85" width="630" height="40" rx="4" fill="#082f49" />
    <text x="30" y="110" fill="#ffffff" font-family="sans-serif" font-size="12">Kashif Enterprises (12 Mo)</text>
    <text x="180" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="12">$24,000</text>
    <text x="300" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="12">$2,000 / mo</text>
    <text x="420" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="12">15th Oct</text>
    <rect x="540" y="95" width="70" height="20" rx="10" fill="#065f46" />
    <text x="575" y="109" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">PAID</text>

    <!-- Row 2 -->
    <rect x="15" y="135" width="630" height="40" rx="4" fill="#082f49" />
    <text x="30" y="160" fill="#ffffff" font-family="sans-serif" font-size="12">Apex Logistics (24 Mo)</text>
    <text x="180" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="12">$60,000</text>
    <text x="300" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="12">$2,500 / mo</text>
    <text x="420" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="12">18th Oct</text>
    <rect x="540" y="145" width="70" height="20" rx="10" fill="#1e3a8a" />
    <text x="575" y="159" fill="#60a5fa" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">UPCOMING</text>

    <!-- Row 3 -->
    <rect x="15" y="185" width="630" height="40" rx="4" fill="#082f49" />
    <text x="30" y="210" fill="#ffffff" font-family="sans-serif" font-size="12">Silverline Motors (6 Mo)</text>
    <text x="180" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="12">$18,500</text>
    <text x="300" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="12">$3,083 / mo</text>
    <text x="420" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="12">22nd Oct</text>
    <rect x="540" y="195" width="70" height="20" rx="10" fill="#065f46" />
    <text x="575" y="209" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">PAID</text>
