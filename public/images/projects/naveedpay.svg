<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06181f" />
      <stop offset="100%" stop-color="#0b2938" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-fin)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#0b1720" stroke="#164e63" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#155e75" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">NaveedPay Fintech &amp; Installment Management Ledger</text>

  <!-- Metrics -->
  <g transform="translate(70, 95)">
    <rect x="0" y="0" width="205" height="75" rx="8" fill="#082f49" stroke="#0284c7" />
