<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-culyte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-culyte)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#1e293b" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Culyte Software House • Official Agency Portal</text>

  <!-- Hero Banner inside site -->
  <g transform="translate(80, 105)">
    <rect x="0" y="0" width="640" height="150" rx="10" fill="#1e1b4b" stroke="#4338ca" />
    <text x="30" y="45" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="bold">CULYTE SOFTWARE HOUSE</text>
    <text x="30" y="80" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Engineering Next-Generation Digital Products</text>
    <text x="30" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="13">Enterprise Full-Stack Web, AI Integrations &amp; Cloud Architectures</text>
  </g>

  <!-- Service Cards -->
  <g transform="translate(80, 275)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="20" y="35" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Custom Web Apps</text>
    <text x="20" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11">High-performance Next.js &amp; React single-page platforms.</text>

    <rect x="220" y="0" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="240" y="35" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">Scalable APIs</text>
    <text x="240" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11">Robust Node.js, Express &amp; microservices backend backbones.</text>

    <rect x="440" y="0" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="460" y="35" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">UI/UX Systems</text>
    <text x="460" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11">Accessible, pixel-perfect design systems with Tailwind &amp; shadcn.</text>
  </g>
</svg>
