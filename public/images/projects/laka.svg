<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-laka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#31104b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-laka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-laka)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#140c24" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Title bar -->
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#24143d" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#e9d5ff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Laka — Kids' Lunch Meal-Plan Platform &amp; Admin</text>

  <!-- Left: Meal Plan Scheduler -->
  <g transform="translate(70, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#1c1130" stroke="#3b1d5e" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🍱 Weekly Meal Scheduler</text>
    <text x="20" y="52" fill="#d8b4fe" font-family="sans-serif" font-size="11">Nutritional planning for school lunchboxes</text>

    <!-- Day 1 -->
    <rect x="15" y="70" width="290" height="60" rx="6" fill="#2a1a45" stroke="#a855f7" stroke-opacity="0.3" />
    <text x="30" y="92" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Monday: Organic Turkey Bento + Fruit</text>
    <text x="30" y="112" fill="#34d399" font-family="sans-serif" font-size="10">✓ Balanced Nutrients • Nut-Free Verified</text>
    <text x="280" y="102" fill="#fb7185" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold">420 kcal</text>

    <!-- Day 2 -->
    <rect x="15" y="140" width="290" height="60" rx="6" fill="#2a1a45" stroke="#3b1d5e" />
    <text x="30" y="162" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Tuesday: Grilled Chicken Wrap &amp; Yogurt</text>
    <text x="30" y="182" fill="#c084fc" font-family="sans-serif" font-size="10">✓ High Protein • Organic Dairy</text>
    <text x="280" y="172" fill="#fb7185" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold">480 kcal</text>

    <!-- Subscription card -->
    <rect x="15" y="210" width="290" height="120" rx="6" fill="url(#accent-laka)" />
    <text x="30" y="238" fill="#4c0519" font-family="sans-serif" font-size="11" font-weight="bold">FAMILY SUBSCRIPTION</text>
    <text x="30" y="270" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="extrabold">Weekly Plan Active</text>
    <text x="30" y="295" fill="#ffe4e6" font-family="sans-serif" font-size="11">Delivering to 3 Schools across Islamabad</text>
  </g>

  <!-- Right: Admin Meal Prep & Kitchen Logistics -->
  <g transform="translate(410, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#1c1130" stroke="#3b1d5e" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">👩‍🍳 Kitchen Dispatch &amp; Admin</text>
    <text x="20" y="52" fill="#9ca3af" font-family="sans-serif" font-size="11">Portion batching, allergy alerts &amp; routes</text>

    <!-- Kitchen batch 1 -->
    <rect x="15" y="70" width="290" height="65" rx="6" fill="#2a1a45" stroke="#a855f7" stroke-opacity="0.3" />
    <text x="30" y="93" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Batch #LK-304: St. Mary's Academy</text>
    <text x="30" y="110" fill="#facc15" font-family="sans-serif" font-size="10">⚠️ 4 Special Dietary Requirements Flagged</text>
    <text x="280" y="103" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold">68 Meals</text>

    <!-- Allergy safety filter -->
    <rect x="15" y="145" width="290" height="65" rx="6" fill="#2a1a45" stroke="#3b1d5e" />
    <text x="30" y="168" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Allergy Verification Engine</text>
    <text x="30" y="186" fill="#34d399" font-family="sans-serif" font-size="10">✓ 100% Automated Cross-Contamination Check</text>

    <!-- Tech specs -->
    <rect x="15" y="220" width="290" height="110" rx="6" fill="#140c24" stroke="#a855f7" stroke-opacity="0.2" />
    <text x="30" y="245" fill="#d8b4fe" font-family="sans-serif" font-size="11" font-weight="bold">FULL STACK ARCHITECTURE</text>
    <text x="30" y="270" fill="#ffffff" font-family="sans-serif" font-size="12">Next.js • TypeScript • ShadCN UI</text>
    <text x="30" y="292" fill="#9ca3af" font-family="sans-serif" font-size="10">Tailwind CSS Responsive Admin Portal</text>
  </g>
</svg>
