<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ecom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-ecom)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#1f2937" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Shopsy Modern E-Commerce Store &amp; Checkout Flow</text>

  <!-- Product Grid -->
  <g transform="translate(80, 105)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="200" height="320" rx="8" fill="#1f2937" stroke="#374151" />
    <rect x="15" y="15" width="170" height="150" rx="6" fill="#374151" />
    <text x="100" y="95" fill="#9ca3af" font-family="sans-serif" font-size="14" text-anchor="middle">🎧 Audio Gear</text>
    <text x="15" y="190" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Wireless Pro ANC</text>
    <text x="15" y="215" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">$199.99</text>
    <rect x="15" y="245" width="170" height="38" rx="6" fill="#3b82f6" />
    <text x="100" y="269" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Add to Cart</text>

    <!-- Product 2 -->
    <rect x="220" y="0" width="200" height="320" rx="8" fill="#1f2937" stroke="#374151" />
    <rect x="235" y="15" width="170" height="150" rx="6" fill="#374151" />
    <text x="320" y="95" fill="#9ca3af" font-family="sans-serif" font-size="14" text-anchor="middle">⌚ Smart Watch</text>
    <text x="235" y="190" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Ultra Horizon GPS</text>
    <text x="235" y="215" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">$249.00</text>
    <rect x="235" y="245" width="170" height="38" rx="6" fill="#3b82f6" />
    <text x="320" y="269" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Add to Cart</text>

    <!-- Product 3 -->
    <rect x="440" y="0" width="200" height="320" rx="8" fill="#1f2937" stroke="#374151" />
    <rect x="455" y="15" width="170" height="150" rx="6" fill="#374151" />
    <text x="540" y="95" fill="#9ca3af" font-family="sans-serif" font-size="14" text-anchor="middle">📷 4K Camera</text>
    <text x="455" y="190" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Mirrorless Lumix</text>
    <text x="455" y="215" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">$899.00</text>
    <rect x="455" y="245" width="170" height="38" rx="6" fill="#3b82f6" />
    <text x="540" y="269" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Add to Cart</text>
  </g>
</svg>
