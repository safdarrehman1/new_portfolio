<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-devlyte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-devlyte)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#18181b" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#e4e4e7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Devlyte Enterprise Suite &amp; Dynamic Pricing Redesign</text>

  <!-- Pricing Cards Grid -->
  <g transform="translate(80, 105)">
    <!-- Plan 1: Starter -->
    <rect x="0" y="0" width="190" height="320" rx="10" fill="#18181b" stroke="#27272a" />
    <text x="20" y="35" fill="#a1a1aa" font-family="sans-serif" font-size="13" font-weight="bold">Starter</text>
    <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">$29<tspan font-size="12" fill="#71717a">/mo</tspan></text>
    <text x="20" y="95" fill="#71717a" font-family="sans-serif" font-size="11">For small teams &amp; startups</text>
    <line x1="20" y1="115" x2="170" y2="115" stroke="#27272a" />
    <text x="20" y="145" fill="#d4d4d8" font-family="sans-serif" font-size="11">✓ 5 Team Seats</text>
    <text x="20" y="175" fill="#d4d4d8" font-family="sans-serif" font-size="11">✓ 50GB Cloud Storage</text>
    <text x="20" y="205" fill="#d4d4d8" font-family="sans-serif" font-size="11">✓ Standard Support</text>
    <rect x="20" y="250" width="150" height="40" rx="6" fill="#27272a" />
    <text x="95" y="275" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Choose Plan</text>

    <!-- Plan 2: Pro (Highlighted) -->
    <rect x="220" y="-15" width="200" height="350" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <rect x="270" y="-25" width="100" height="20" rx="10" fill="#4f46e5" />
    <text x="320" y="-11" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MOST POPULAR</text>
    <text x="240" y="35" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="bold">Professional</text>
    <text x="240" y="70" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold">$79<tspan font-size="13" fill="#a5b4fc">/mo</tspan></text>
    <text x="240" y="95" fill="#c7d2fe" font-family="sans-serif" font-size="11">Best for scaling engineering</text>
    <line x1="240" y1="115" x2="390" y2="115" stroke="#4338ca" />
    <text x="240" y="145" fill="#e0e7ff" font-family="sans-serif" font-size="11">✓ Unlimited Seats</text>
    <text x="240" y="175" fill="#e0e7ff" font-family="sans-serif" font-size="11">✓ 1TB High-Speed CDN</text>
    <text x="240" y="205" fill="#e0e7ff" font-family="sans-serif" font-size="11">✓ Priority 24/7 SLA</text>
    <text x="240" y="235" fill="#e0e7ff" font-family="sans-serif" font-size="11">✓ Advanced Analytics</text>
    <rect x="240" y="270" width="160" height="42" rx="8" fill="#4f46e5" />
    <text x="320" y="296" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Start 14-Day Trial</text>

    <!-- Plan 3: Enterprise -->
    <rect x="450" y="0" width="190" height="320" rx="10" fill="#18181b" stroke="#27272a" />
    <text x="470" y="35" fill="#a1a1aa" font-family="sans-serif" font-size="13" font-weight="bold">Enterprise</text>
    <text x="470" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">Custom</text>
    <text x="470" y="95" fill="#71717a" font-family="sans-serif" font-size="11">Dedicated infrastructure</text>
    <line x1="470" y1="115" x2="620" y2="115" stroke="#27272a" />
    <text x="470" y="145" fill="#d4d4d8" font-family="sans-serif" font-size="11">✓ Custom SSO &amp; SAML</text>
    <text x="470" y="175" fill="#d4d4d8" font-family="sans-serif" font-size="11">✓ Dedicated Account Rep</text>
    <text x="470" y="205" fill="#d4d4d8" font-family="sans-serif" font-size="11">✓ On-prem Deployment</text>
    <rect x="470" y="250" width="150" height="40" rx="6" fill="#27272a" />
    <text x="545" y="275" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Talk to Sales</text>
  </g>
</svg>
