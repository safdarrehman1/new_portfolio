<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-dash)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#1e293b" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">I-Y Enterprise Analytics &amp; Visual Intelligence Dashboard</text>

  <!-- Metric row -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="145" height="70" rx="6" fill="#1e293b" />
    <text x="15" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Revenue</text>
    <text x="15" y="52" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">$84,320</text>

    <rect x="165" y="0" width="145" height="70" rx="6" fill="#1e293b" />
    <text x="15" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">New Users</text>
    <text x="15" y="52" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold">+4,912</text>

    <rect x="330" y="0" width="145" height="70" rx="6" fill="#1e293b" />
    <text x="15" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Sessions</text>
    <text x="15" y="52" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="bold">1,840</text>

    <rect x="495" y="0" width="145" height="70" rx="6" fill="#1e293b" />
    <text x="15" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Bounce Rate</text>
    <text x="15" y="52" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">24.2%</text>
  </g>

  <!-- Chart Visualizer -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="400" height="240" rx="8" fill="#111827" stroke="#1f2937" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Revenue Growth vs Forecast</text>
    <!-- Line chart curve -->
    <path d="M40 180 Q100 120, 160 140 T280 80 T360 40" fill="none" stroke="#3b82f6" stroke-width="4" />
    <path d="M40 180 Q100 120, 160 140 T280 80 T360 40 L360 200 L40 200 Z" fill="#3b82f6" opacity="0.1" />

    <!-- Donut chart on right -->
    <rect x="420" y="0" width="220" height="240" rx="8" fill="#111827" stroke="#1f2937" />
    <text x="440" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Traffic Source</text>
    <circle cx="530" cy="130" r="50" fill="none" stroke="#3b82f6" stroke-width="20" stroke-dasharray="180 360" />
    <circle cx="530" cy="130" r="50" fill="none" stroke="#10b981" stroke-width="20" stroke-dasharray="90 360" stroke-dashoffset="-180" />
    <circle cx="530" cy="130" r="50" fill="none" stroke="#f59e0b" stroke-width="20" stroke-dasharray="60 360" stroke-dashoffset="-270" />
  </g>
</svg>
