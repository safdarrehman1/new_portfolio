<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-lawn)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#022c22" stroke="#047857" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#065f46" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#d1fae5" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">ThinkLawn Care &amp; Operational Management Portal</text>

  <!-- Quote Estimator UI -->
  <g transform="translate(70, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#064e3b" stroke="#059669" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🌱 Instant Lawn Quote Calculator</text>
    <text x="20" y="55" fill="#a7f3d0" font-family="sans-serif" font-size="11">Select acreage, service frequency &amp; treatments</text>

    <!-- Slider Mock -->
    <text x="20" y="90" fill="#ecfdf5" font-family="sans-serif" font-size="12">Lawn Size: 4,500 sq.ft</text>
    <rect x="20" y="105" width="280" height="8" rx="4" fill="#022c22" />
    <rect x="20" y="105" width="160" height="8" rx="4" fill="#34d399" />
    <circle cx="180" cy="109" r="8" fill="#ffffff" />

    <!-- Services list -->
    <rect x="20" y="130" width="280" height="40" rx="6" fill="#022c22" stroke="#10b981" />
    <text x="35" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">Mowing &amp; Edging (Bi-Weekly)</text>

    <rect x="20" y="180" width="280" height="40" rx="6" fill="#022c22" stroke="#047857" />
    <text x="35" y="205" fill="#ffffff" font-family="sans-serif" font-size="12">Aeration &amp; Overseeding</text>

    <!-- Total box -->
    <rect x="20" y="240" width="280" height="85" rx="6" fill="#047857" />
    <text x="35" y="265" fill="#d1fae5" font-family="sans-serif" font-size="11">Estimated Monthly Subscription</text>
    <text x="35" y="300" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">$189.00</text>
  </g>

  <!-- Crew Scheduling Grid -->
  <g transform="translate(410, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#064e3b" stroke="#059669" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🚜 Crew Field Scheduling</text>
    <text x="20" y="55" fill="#a7f3d0" font-family="sans-serif" font-size="11">Automated GPS route optimization</text>

    <!-- Crew Card 1 -->
    <rect x="20" y="80" width="280" height="70" rx="6" fill="#022c22" stroke="#10b981" />
    <text x="35" y="105" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Crew Alpha (3 Technicians)</text>
    <text x="35" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="11">6 of 8 properties serviced • On Track</text>

    <!-- Crew Card 2 -->
    <rect x="20" y="165" width="280" height="70" rx="6" fill="#022c22" stroke="#059669" />
    <text x="35" y="190" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Crew Beta (2 Technicians)</text>
    <text x="35" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="11">West Sector Aeration in progress</text>

    <!-- Completed summary -->
    <rect x="20" y="250" width="280" height="75" rx="6" fill="#022c22" />
    <text x="35" y="275" fill="#a7f3d0" font-family="sans-serif" font-size="11">Total Yards Completed Today</text>
    <text x="35" y="305" fill="#34d399" font-family="sans-serif" font-size="22" font-weight="bold">38 Properties</text>
  </g>
</svg>
