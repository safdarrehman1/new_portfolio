<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-chedmed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-chedmed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-chedmed)" rx="16" />
  <rect x="50" y="40" width="700" height="420" rx="12" fill="#0b1329" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Title bar -->
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#142142" />
  <circle cx="75" cy="60" r="5" fill="#ef4444" />
  <circle cx="95" cy="60" r="5" fill="#f59e0b" />
  <circle cx="115" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#bfdbfe" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Chedmed — Online Store &amp; Admin Management Portal</text>

  <!-- Left: E-Commerce Storefront -->
  <g transform="translate(70, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#111c3a" stroke="#1e293b" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🛍️ Customer Storefront</text>
    <text x="20" y="52" fill="#93c5fd" font-family="sans-serif" font-size="11">Catalog filtering, instant cart &amp; checkout</text>

    <!-- Product 1 -->
    <rect x="15" y="70" width="290" height="70" rx="6" fill="#172554" stroke="#3b82f6" stroke-opacity="0.3" />
    <rect x="25" y="80" width="50" height="50" rx="4" fill="#1e3a8a" />
    <text x="50" y="110" fill="#93c5fd" font-family="sans-serif" font-size="10" text-anchor="middle">ITEM</text>
    <text x="85" y="96" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Clinical Diagnostics Set</text>
    <text x="85" y="114" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold">$129.00</text>
    <text x="280" y="114" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="end">In Stock (84)</text>

    <!-- Product 2 -->
    <rect x="15" y="150" width="290" height="70" rx="6" fill="#172554" stroke="#1e293b" />
    <rect x="25" y="160" width="50" height="50" rx="4" fill="#1e3a8a" />
    <text x="50" y="190" fill="#93c5fd" font-family="sans-serif" font-size="10" text-anchor="middle">ITEM</text>
    <text x="85" y="176" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Digital Monitoring Device</text>
    <text x="85" y="194" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold">$249.50</text>
    <text x="280" y="194" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="end">In Stock (120)</text>

    <!-- Cart Summary -->
    <rect x="15" y="230" width="290" height="100" rx="6" fill="url(#accent-chedmed)" />
    <text x="30" y="258" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">ACTIVE SHOPPING CART</text>
    <text x="30" y="290" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="extrabold">$378.50</text>
    <text x="280" y="290" fill="#dbeafe" font-family="sans-serif" font-size="11" text-anchor="end">2 Items • Instant Sync</text>
  </g>

  <!-- Right: Admin Order & Inventory Console -->
  <g transform="translate(410, 95)">
    <rect x="0" y="0" width="320" height="345" rx="8" fill="#111c3a" stroke="#1e293b" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">📦 Merchant Admin Panel</text>
    <text x="20" y="52" fill="#9ca3af" font-family="sans-serif" font-size="11">Order fulfillment, customer lookup &amp; analytics</text>

    <!-- Order 1 -->
    <rect x="15" y="70" width="290" height="60" rx="6" fill="#172554" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="30" y="92" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Order #CHD-7821 • John M.</text>
    <text x="30" y="112" fill="#34d399" font-family="sans-serif" font-size="10">● Paid via Card • Processing Dispatch</text>
    <text x="280" y="102" fill="#60a5fa" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold">$412.00</text>

    <!-- Order 2 -->
    <rect x="15" y="140" width="290" height="60" rx="6" fill="#172554" stroke="#1e293b" />
    <text x="30" y="162" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Order #CHD-7820 • Sarah K.</text>
    <text x="30" y="182" fill="#60a5fa" font-family="sans-serif" font-size="10">● Shipped via Express Courier</text>
    <text x="280" y="172" fill="#60a5fa" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold">$189.50</text>

    <!-- Inventory Stat Grid -->
    <rect x="15" y="210" width="290" height="120" rx="6" fill="#0b1329" stroke="#3b82f6" stroke-opacity="0.2" />
    <text x="30" y="235" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold">INVENTORY &amp; REVENUE OVERVIEW</text>
    <text x="30" y="268" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">$42,850 Revenue</text>
    <text x="30" y="292" fill="#34d399" font-family="sans-serif" font-size="11">✓ Zero Stock Discrepancy • Realtime Zustand</text>
    <text x="30" y="312" fill="#9ca3af" font-family="sans-serif" font-size="10">Built with React.js &amp; Tailwind CSS</text>
  </g>
</svg>
